[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlora-qr-svd"
version = "0.1.0"
description = "QLoRA with quantization-residual SVD projected sharpness-aware training"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "Research code; third-party components retain their own licenses." }
dependencies = [
  "accelerate==1.2.1",
  "bitsandbytes==0.45.2",
  "datasets==3.2.0",
  "peft==0.14.0",
  "PyYAML==6.0.2",
  "safetensors==0.5.2",
  "scikit-learn==1.6.1",
  "transformers==4.49.0",
  "numpy",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
]

[project.scripts]
qlora-qr-svd-train = "qlora_qr_svd.cli.train:main"
qlora-qr-svd-check = "qlora_qr_svd.cli.check_environment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

